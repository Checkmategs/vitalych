services:
  db:
    image: postgres:16
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-vitalych}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-vitalych}
      POSTGRES_DB: ${POSTGRES_DB:-vitalych}
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 3s
      timeout: 3s
      retries: 10

volumes:
  pgdata:
